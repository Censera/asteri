name: test

on: [push, pull_request]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-20-dev lld-20 clang-20
          echo "LLVM_SYS_201_PREFIX=/usr/lib/llvm-20" >> $GITHUB_ENV
          echo "LLVM_LINK_SHARED=1" >> $GITHUB_ENV

      - name: macOS
        if: runner.os == 'macOS'
        run: |
          brew install llvm@20
          echo "LLVM_SYS_201_PREFIX=$(brew --prefix llvm@20)" >> $GITHUB_ENV
          echo "LLVM_LINK_SHARED=1" >> $GITHUB_ENV

      - name: Windows
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $llvm_url = "https://github.com/llvm/llvm-project/releases/download/llvmorg-20.1.0/clang+llvm-20.1.0-x86_64-pc-windows-msvc.tar.xz"
          curl -L $llvm_url -o $env:TEMP\llvm.tar.xz
          7z x $env:TEMP\llvm.tar.xz -o$env:TEMP\llvm -y
          7z x $env:TEMP\llvm\*.tar -o"C:\Program Files\LLVM" -y
          echo "LLVM_SYS_201_PREFIX=C:\Program Files\LLVM" >> $env:GITHUB_ENV
          echo "LLVM_LINK_SHARED=1" >> $env:GITHUB_ENV

      - run: cargo build
      - run: cargo test
