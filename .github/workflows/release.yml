name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        linkage: [static, dynamic]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Install LLVM (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-20-dev lld-20 clang-20 libllvm20 libpolly-20-dev
          echo "LLVM_SYS_201_PREFIX=/usr/lib/llvm-20" >> $GITHUB_ENV

      - name: Install LLVM (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          brew install llvm@20
          echo "LLVM_SYS_201_PREFIX=$(brew --prefix llvm@20)" >> $GITHUB_ENV

      - name: Build
        run: |
          if [ "${{ matrix.linkage }}" = "dynamic" ]; then
            cargo build --release --features inkwell/llvm20-1-prefer-dynamic
          else
            cargo build --release
          fi
        shell: bash

      - name: Rename
        run: |
          if [ "${{ matrix.os }}" = "macos-latest" ]; then
            mv target/release/asteri asteri-macos-${{ matrix.linkage }}
          else
            mv target/release/asteri asteri-linux-${{ matrix.linkage }}
          fi
        shell: bash

      - name: Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            asteri-linux-static
            asteri-linux-dynamic
            asteri-macos-static
            asteri-macos-dynamic
          fail_on_unmatched_files: false
