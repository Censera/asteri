[lints.clippy]

[package]
name = "astery"
version = "26.8.0"
edition = "2021"
description = "astery the programming language"
repository = "https://github.com/Censera/astery"
readme = "README.md"
license = "Apache-License-2.0"
keywords = ["compiler", "language", "llvm"]
categories = ["command-line-utilities", "development-tools::compilers"]

[dependencies]
inkwell = { version = "0.9.0", features = ["llvm20-1"] }

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
panic = "abort"
